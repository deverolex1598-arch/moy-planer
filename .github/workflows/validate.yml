name: Validate planner
on:
  push:
    branches:
      - auth-and-cycle-foundation
  pull_request:
    branches:
      - planner-cozy-redesign
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check cycle.js
          node --check auth.js
      - name: Validate JSON files
        run: |
          node -e "JSON.parse(require('fs').readFileSync('seed.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('manifest.webmanifest','utf8'))"
      - name: Check required app assets
        run: |
          test -s index.html
          test -s style.css
          test -s sw.js
          test -s icon.svg
