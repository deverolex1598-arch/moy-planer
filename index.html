<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7e7eb"><meta name="description" content="Личный офлайн-планер">
<link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="style.css"><title>Мой планер</title></head>
<body><div class="app">
<header><div><div class="eyebrow">ТВОЁ ПРОСТРАНСТВО</div><h1>Мой планер <span>♡</span></h1><p id="todayLabel"></p></div><button class="round" id="quoteBtn" aria-label="Новая цитата">✧</button></header>
<div class="quote" id="quoteBox"></div>
<nav id="tabs">
<button data-tab="home" class="active">⌂<small>Главная</small></button><button data-tab="week">▦<small>Неделя</small></button><button data-tab="calendar">▦<small>Календарь</small></button><button data-tab="cycle">♡<small>Женские дни</small></button><button data-tab="more">•••<small>Ещё</small></button>
</nav>
<main id="view"></main>
<footer><span id="storageStatus">Данные хранятся на этом устройстве</span><button id="accountBtn" type="button">♡ Аккаунт</button><button id="settingsBtn">⚙ Настройки</button></footer>
<section id="accountPanel" class="card" hidden aria-live="polite"><div class="row between"><h2>Мой аккаунт ♡</h2><button id="closeAccount" class="mini" type="button">Закрыть</button></div><p id="authStatus" class="muted">Войди, чтобы хранить личные записи и синхронизировать их.</p><form id="authForm"><label>Email<input name="email" type="email" autocomplete="email" required></label><label id="passwordLabel">Пароль<input name="password" type="password" minlength="8" autocomplete="current-password"></label><div class="form-actions"><button class="primary" type="button" id="signInPassword">Войти с паролем</button><button class="ghost" type="button" id="signUpPassword">Создать аккаунт</button><button class="ghost" type="button" id="signInMagic">Получить ссылку на почту</button></div></form><button id="signOut" class="ghost" type="button" hidden>Выйти из аккаунта</button></section>
</div><dialog id="editDialog"><form method="dialog" id="editForm"><div class="dialogHead"><h2 id="dialogTitle">Новая запись</h2><button class="round" value="cancel">×</button></div><label id="fieldLabel">Название<input id="editText" maxlength="300" required></label><label id="dayField">День<select id="editDay"></select></label><div class="actions"><button class="primary" id="saveEdit" value="default">Сохранить</button><button class="ghost" value="cancel">Отмена</button></div></form></dialog>
<script src="app.js"></script><script src="cycle.js"></script><script src="auth.js"></script><script>if("serviceWorker" in navigator && location.protocol!=="file:"){window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));}</script></body></html>
