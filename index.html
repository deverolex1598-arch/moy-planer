<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7e7eb"><meta name="description" content="Личный офлайн-планер">
<link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="style.css"><title>Мой планер</title></head>
<body><div class="app">
<header><div><div class="eyebrow">ТВОЁ ПРОСТРАНСТВО</div><h1>Мой планер <span>♡</span></h1><p id="todayLabel"></p></div><button class="round" id="quoteBtn" aria-label="Новая цитата">✧</button></header>
<div class="quote" id="quoteBox"></div>
<nav id="tabs">
<button data-tab="home" class="active">⌂<small>Главная</small></button><button data-tab="week">▦<small>Неделя</small></button><button data-tab="habits">♡<small>Привычки</small></button><button data-tab="notes">✎<small>Заметки</small></button><button data-tab="archive">▣<small>Архив</small></button><button data-tab="stats">◔<small>Прогресс</small></button>
</nav>
<main id="view"></main>
<footer><span>Данные хранятся только на этом устройстве</span><button id="settingsBtn">⚙ Настройки</button></footer>
</div><dialog id="editDialog"><form method="dialog" id="editForm"><div class="dialogHead"><h2 id="dialogTitle">Новая запись</h2><button class="round" value="cancel">×</button></div><label id="fieldLabel">Название<input id="editText" maxlength="300" required></label><label id="dayField">День<select id="editDay"></select></label><div class="actions"><button class="primary" id="saveEdit" value="default">Сохранить</button><button class="ghost" value="cancel">Отмена</button></div></form></dialog>
<script src="app.js"></script></body></html>
